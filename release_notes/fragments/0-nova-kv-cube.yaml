pr: 0
entries:
  - category: feature
    text: >-
      Added an experimental NOVA Cube compressed KV attention backend for
      calibrated dense Qwen models on Ascend A5 with Model Runner V2, selected
      with nova_kv.backend="cube" in additional config. The prototype supports
      up to four active requests; full task accuracy and broader device coverage
      remain pending.
  - category: performance
    text: >-
      Parallelized exact-window Decode attention, reused K/V tiles across
      query groups at batch 4, and optimized batch-1 encoding and projection.
      Matched A5 TP2 measurements show 8.45% lower Decode throughput than BF16
      at 90K/batch 4 and 5.99% higher throughput at 30K/batch 1; batch-4 TPOT
      is 9.88% higher.
